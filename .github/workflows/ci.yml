name: CI Frontend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Lint, build et audit
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npm run lint
        continue-on-error: true

      - name: Build de production
        run: npm run build

      - name: Audit des dépendances
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Archivage du build
        uses: actions/upload-artifact@v4
        with:
          name: screenclub-frontend-dist
          path: dist/